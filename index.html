<!doctype html><html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViliQuiz</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#10072b,#21105b);color:#fff;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:22px}.card{background:#17112f;border:1px solid #3e2d71;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 10px 30px #0004}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}button,input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #55437e;margin:6px 0;background:#241a46;color:#fff}button{background:#7651d8;border:0;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}h1{font-size:42px;margin:8px 0}.muted{color:#bcb4d4}.hidden{display:none}.answers button{min-height:60px}.pill{display:inline-block;background:#2b2050;padding:7px 11px;border-radius:20px;margin:3px}.danger{background:#a83f65}.success{color:#70e6a4}.error{color:#ff8fa7}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:600px){h1{font-size:32px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>ViliQuiz</h1><div class="muted">Tietovisa + pelihuoneet + shop + admin</div></div><div id="userBox"></div></div><section id="auth" class="card"><h2>Kirjaudu</h2><input id="username" placeholder="Käyttäjänimi"><input id="password" type="password" placeholder="Salasana"><div class="grid"><button onclick="login()">Kirjaudu</button><button onclick="register()">Luo tili</button></div><p id="authMsg" class="muted"></p></section><main id="app" class="hidden"><section id="home" class="card"><h2>Etusivu</h2><div class="grid"><button onclick="show('create')">Luo peli</button><button onclick="show('join')">Liity peliin</button><button onclick="loadShop()">Shop</button><button onclick="profile()">Profiili</button><button onclick="adminLogin()">Admin</button></div></section><section id="create" class="card hidden"><h2>Luo peli</h2><select id="mode"><option>Classic</option><option>Speed</option><option>Battle</option><option>Survival</option><option>Treasure</option></select><select id="count"><option value="5">5 kysymystä</option><option value="8" selected>8 kysymystä</option></select><button onclick="createGame()">Luo pelihuone</button></section><section id="join" class="card hidden"><h2>Liity peliin</h2><input id="code" maxlength="6" placeholder="6-numeroinen koodi"><button onclick="joinGame()">Liity</button></section><section id="lobby" class="card hidden"><h2>Pelihuone <span id="gameCode"></span></h2><p id="players"></p><button onclick="startGame()">Aloita peli</button><button class="danger" onclick="show('home')">Poistu</button></section><section id="game" class="card hidden"><div class="pill" id="modeLabel"></div><h2 id="question"></h2><div class="answers" id="answers"></div><p id="gameMsg"></p><button onclick="refreshGame()">Päivitä pelitilanne</button></section><section id="results" class="card hidden"><h2>Tulokset</h2><div id="resultText"></div><button onclick="show('home')">Etusivulle</button></section><section id="shop" class="card hidden"><h2>Shop</h2><div id="packages" class="grid"></div><button onclick="show('home')">Takaisin</button></section><section id="profile" class="card hidden"><h2>Profiili</h2><div id="profileText"></div><button onclick="show('home')">Takaisin</button></section><section id="admin" class="card hidden"><h2>Admin</h2><div class="grid"><button onclick="adminList()">Päivitä hallinta</button><button onclick="adminPackage()">Lisää paketti</button><button onclick="adminCoins()">Anna kolikoita</button><button onclick="adminKick()">Poista pelaaja huoneesta</button></div><pre id="adminOut"></pre><button onclick="show('home')">Takaisin</button></section></main></div><script>
let me=null,game=null,admin=false;const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}function api(path,opt={}){return fetch(path,{headers:{'Content-Type':'application/json'},...opt}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Virhe');return d})}function login(){api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})}).then(d=>{me=d.user;startApp()}).catch(e=>$('authMsg').textContent=e.message)}function register(){api('/api/register',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})}).then(d=>{me=d.user;startApp()}).catch(e=>$('authMsg').textContent=e.message)}function startApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userBox').textContent=me.username+' • '+me.coins+' 🪙';show('home')}function createGame(){api('/api/create',{method:'POST',body:JSON.stringify({username:me.username,mode:$('mode').value,count:$('count').value})}).then(d=>{game=d.game;lobby()}).catch(alert)}function joinGame(){api('/api/join',{method:'POST',body:JSON.stringify({username:me.username,code:$('code').value})}).then(d=>{game=d.game;lobby()}).catch(alert)}function lobby(){show('lobby');$('gameCode').textContent=game.code;$('players').textContent='Pelaajat: '+game.players.join(', ')}function startGame(){api('/api/start',{method:'POST',body:JSON.stringify({username:me.username,code:game.code,admin})}).then(d=>{game=d.game;renderQuestion(d.question)}).catch(alert)}function renderQuestion(q){show('game');$('modeLabel').textContent=game.mode;$('question').textContent=q.q;$('gameMsg').textContent='';$('answers').innerHTML=q.a.map((x,i)=>`<button onclick="answer(${i})">${x}</button>`).join('')}function answer(i){api('/api/answer',{method:'POST',body:JSON.stringify({username:me.username,code:game.code,index:game.index,answer:i})}).then(d=>{game=d.game;if(game.finished){results()}else renderQuestion(d.nextQuestion)}).catch(alert)}function refreshGame(){api('/api/game?code='+game.code).then(d=>{game=d.game;if(game.finished)results();else if(game.started)renderQuestion(d.questions[game.index])}).catch(alert)}function results(){show('results');const rows=Object.entries(game.scores).sort((a,b)=>b[1]-a[1]);$('resultText').innerHTML=rows.map((x,i)=>`<div class="pill">${i+1}. ${x[0]} — ${x[1]} pistettä</div>`).join('');me.coins+=0;startApp()}function loadShop(){api('/api/packages').then(d=>{$('packages').innerHTML=d.packages.map(p=>`<div class="card"><h3>${p.name}</h3><p>${p.items.join(', ')}</p><b>${p.price} 🪙</b><button onclick="buy('${p.id}')">Osta</button></div>`).join('');show('shop')}).catch(alert)}function buy(id){api('/api/buy',{method:'POST',body:JSON.stringify({username:me.username,id})}).then(d=>{me=d.user;startApp();loadShop()}).catch(alert)}function profile(){ $('profileText').innerHTML=`<p>Käyttäjä: ${me.username}</p><p>Kolikot: ${me.coins}</p><p>XP: ${me.xp}</p><p>Taso: ${me.level}</p><p>Pelit: ${me.stats.games}</p><p>Oikeat vastaukset: ${me.stats.correct}</p><p>Inventaario: ${me.inventory.join(', ')}</p>`;show('profile')}function adminLogin(){const p=prompt('Admin-salasana');if(p==='blooket123'){admin=true;adminList()}else alert('Väärä salasana')}function adminList(){api('/api/admin',{method:'POST',body:JSON.stringify({password:'blooket123',action:'list'})}).then(d=>{$('adminOut').textContent=JSON.stringify(d,null,2);show('admin')}).catch(alert)}function adminPackage(){const name=prompt('Paketin nimi');if(!name)return;const price=prompt('Hinta kolikoissa','100');const items=prompt('Esineet pilkuilla eroteltuna','Uusi Skin');api('/api/admin',{method:'POST',body:JSON.stringify({password:'blooket123',action:'addPackage',name,price,items})}).then(d=>{alert('Paketti lisätty');adminList()}).catch(alert)}function adminCoins(){const u=prompt('Käyttäjänimi');const amount=prompt('Kolikoiden määrä','100');api('/api/admin',{method:'POST',body:JSON.stringify({password:'blooket123',action:'giveCoins',username:u,amount})}).then(()=>{alert('Kolikot annettu');adminList()}).catch(alert)}function adminKick(){const u=prompt('Käyttäjänimi');api('/api/admin',{method:'POST',body:JSON.stringify({password:'blooket123',action:'kick',username:u})}).then(()=>{alert('Pelaaja poistettu aktiivisista huoneista');adminList()}).catch(alert)}
</script></body></html>
